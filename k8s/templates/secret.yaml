# 실제 값은 이 파일에 커밋하지 말고 values-secret.yaml(gitignore) 또는
# --set-string secret.GITEA_TOKEN=... 로 덮어써서 배포한다.
apiVersion: v1
kind: Secret
metadata:
  name: k8s-manager-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
{{- range $key, $value := .Values.secret }}
  {{ $key }}: {{ $value | quote }}
{{- end }}
