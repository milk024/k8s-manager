{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: k8s-manager-route
  namespace: {{ .Release.Namespace }}
spec:
  parentRefs:
    - name: {{ .Values.gateway.existingGatewayName }}
      namespace: {{ .Release.Namespace }}
      {{- if .Values.gateway.existingGatewaySectionName }}
      sectionName: {{ .Values.gateway.existingGatewaySectionName }}
      {{- end }}
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: k8s-manager-svc
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      backendRefs:
        - name: k8s-manager-svc
          port: {{ .Values.service.port }}
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: k8s-manager-svc
          port: {{ .Values.service.port }}
{{- if .Values.gateway.exposeGui }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ .Values.gateway.guiPathPrefix }}
      backendRefs:
        - name: {{ .Values.gateway.guiServiceName }}
          port: {{ .Values.gateway.guiServicePort }}
{{- end }}
{{- end }}