# ADR-036: Gitea Container Registry로 확정, 실제 주소 확인됨(10.0.0.23:80, HTTP·PoC 단계).
# 조직명은 infra가 아니라 myorg. latest 태그는 운영 배포 금지(ADR-036/039) —
# package.json 버전에 맞춘 v{major}.{minor}.{patch}로 태깅해서 이 값을 갱신한다.
# 주의: HTTP 레지스트리라 kubelet/containerd가 pull하려면 노드의 containerd에
# insecure registry(또는 mirror) 설정이 되어 있어야 한다 — TLS 붙기 전까지 확인 필요.
image:
  repository: 10.0.0.23:80/myorg/k8s-manager
  tag: v0.1.3
  pullPolicy: IfNotPresent
  # 레포가 private라 kubelet이 pull하려면 imagePullSecrets가 필요하다.
  # 아래 "kubectl create secret docker-registry" 명령으로 미리 만들어두고 이름을 넣는다.
  pullSecretName: "k8s-manager-registry-secret"

replicaCount: 1

service:
  port: 8000

# .env.example과 1:1 대응 (비-시크릿 값)
config:
  PORT: "8000"
  ALLOWED_ORIGINS: ""
  K8S_NAMESPACE: "infra"
  GITEA_BASE_URL: "http://gitea-http.infra.svc.cluster.local:3000"
  PROMETHEUS_BASE_URL: "http://kube-prometheus-stack-prometheus.monitoring.svc.cluster.local:9090"
  MIRROR_REGISTRY_URL: ""
  MONITOR_POLL_INTERVAL_MS: "5000"

# 실제 값은 여기 커밋하지 말고 배포 시 -f values-secret.yaml(별도, gitignore) 또는
# --set-string secret.GITEA_WEBHOOK_SECRET=... 로 덮어쓴다.
secret:
  GITEA_WEBHOOK_SECRET: ""

# GITEA_TOKEN은 여기서 관리하지 않는다 — helm upgrade 때마다 이 값이 기본값(빈 문자열)으로
# 리셋되는 사고가 반복돼서(--reuse-values를 빠뜨리거나, 다른 리소스 충돌로 upgrade가
# 중간에 실패해도 이미 적용된 값 등) 아예 helm 밖에서 직접 만든 Secret을 참조하도록 분리했다.
# 사전 준비 (커밋 금지, 직접 실행 — 값을 다시 붙여넣지 않도록 본인 터미널에서):
#   kubectl create secret generic k8s-manager-gitea-token -n infra \
#     --from-literal=GITEA_TOKEN=<발급받은 토큰> --dry-run=client -o yaml | kubectl apply -f -
giteaTokenSecretName: k8s-manager-gitea-token

# ADR-007/030: infra namespace에는 이미 공용 Gateway(`infra-gateway`, 10.0.0.23)가
# Gitea Helm Chart와 별개로 떠 있다 — 우리가 새로 Gateway를 만들지 않고 이 기존
# Gateway에 HTTPRoute만 추가한다(IP 낭비 방지).
# (2026-08-25 갱신) TLS/도메인이 실제로 붙었다 — infra-gateway에 https(443) 리스너가
# 추가되었고 hostname은 llm-k8s-monitor.example.ac.kr, 인증서는 wildcard-example-tls.
# ADR-006(PoC: HTTP만)은 이걸로 해소됨 — 아래 existingGatewaySectionName/hostname이
# 그 https 리스너를 가리킨다.
# ADR-005: gitea의 HTTPRoute가 이미 path "/"를 전부 점유하고 있어서, GUI는 "/"가 아니라
# guiPathPrefix(기본 /dashboard)로 양보해서 충돌을 피한다.
gateway:
  enabled: true
  existingGatewayName: infra-gateway
  existingGatewaySectionName: https
  hostname: "llm-k8s-monitor.example.ac.kr"
  tlsSecretName: "wildcard-example-tls"
  exposeGui: true          # GUI(local-ops-gui-svc) 저장소가 아직 없어서 기본 비활성화 — 준비되면 true로
  guiPathPrefix: /dashboard # gitea가 "/"를 점유하고 있어 GUI는 이 prefix로 노출 (ADR-005)
  guiServiceName: local-ops-gui-svc
  guiServicePort: 80

# ADR-031: StorageClass는 nfs-csi(default)로 확인됨. 용량 계획은 아직 미정이라 기본 비활성화.
persistence:
  enabled: false
  storageClassName: nfs-csi
  size: 1Gi
