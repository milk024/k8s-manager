# vkey-postgres-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vkey-postgres
  namespace: vkey-system
spec:
  replicas: 1
  strategy:
    type: Recreate   # DB는 RollingUpdate 시 데이터 충돌 방지를 위해 Recreate 사용
  selector:
    matchLabels:
      app: vkey-postgres
  template:
    metadata:
      labels:
        app: vkey-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:17.10
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: vkey-postgres-secret
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
              subPath: pgdata   # 빈 디렉토리 요구사항 회피용 서브패스
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vkey-postgres-pvc