# vkey-pgadmin-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vkey-pgadmin
  namespace: vkey-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vkey-pgadmin
  template:
    metadata:
      labels:
        app: vkey-pgadmin
    spec:
      containers:
        - name: pgadmin
          image: dpage/pgadmin4:latest
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: vkey-pgadmin-secret