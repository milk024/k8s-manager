# vkey-pgadmin-httproute.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vkey-pgadmin-route
  namespace: vkey-system
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: infra-gateway
      namespace: infra
      sectionName: pgadmin   # 위에서 추가한 리스너 이름
  rules:
    - backendRefs:
        - name: vkey-pgadmin
          port: 80