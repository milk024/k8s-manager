apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: http-to-https-redirect
  namespace: infra
spec:
  parentRefs:
    - name: infra-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /myorg
      backendRefs:
        - name: gitea-http
          port: 3000
    # Docker Registry API 경로 추가
    - matches:
        - path:
            type: PathPrefix
            value: /v2
      backendRefs:
        - name: gitea-http
          port: 3000
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: k8s-manager-svc
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /socket.io
      backendRefs:
        - name: k8s-manager-svc
          port: 8000
    - matches:
        - path:
            type: PathPrefix
            value: /webhook
      backendRefs:
        - name: k8s-manager-svc
          port: 8000
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301