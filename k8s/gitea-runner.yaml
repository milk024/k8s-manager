# gitea-runner.yaml
# Gitea Actions Runner (act_runner) + DinD(Docker-in-Docker) 사이드카.
# k8s_manager와 분리 운영: 이 Pod만 privileged(DinD)이고, k8s_manager의
# ServiceAccount/ClusterRole(k8s/templates/rbac.yaml)과는 무관 — 기본 ServiceAccount 사용,
# K8s API 호출 권한 자체가 없음.
#
# 사전 준비 (커밋 금지, 직접 실행):
#   kubectl create secret generic gitea-runner-token -n infra --from-literal=token="<registration token>"
apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-runner-config
  namespace: infra
data:
  # job 컨테이너가 dind 사이드카의 도커 소켓을 그대로 공유하게 해서(DooD),
  # dind에 설정한 --insecure-registry가 job의 docker login/build/push에도 적용되게 한다.
  # (job 컨테이너 자체에는 도커 데몬이 없어서 별도 소켓 마운트 없이는 dind 설정이 무시됐다.)
  config.yaml: |
    container:
      options: "-v /var/run/docker.sock:/var/run/docker.sock"
      # act_runner는 보안상 valid_volumes에 없는 바인드 마운트를 조용히 무시한다 —
      # 위 options의 docker.sock 마운트가 실제로 적용되려면 여기 명시해야 한다.
      valid_volumes:
        - "/var/run/docker.sock"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea-runner
  namespace: infra
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gitea-runner
  template:
    metadata:
      labels:
        app: gitea-runner
    spec:
      containers:
        - name: runner
          image: gitea/act_runner:latest
          env:
            - name: GITEA_INSTANCE_URL
              value: "http://gitea-http.infra.svc.cluster.local:3000"
            - name: GITEA_RUNNER_REGISTRATION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: gitea-runner-token
                  key: token
            - name: DOCKER_HOST
              value: "tcp://localhost:2376"
            - name: DOCKER_CERT_PATH
              value: "/certs/client"
            - name: DOCKER_TLS_VERIFY
              value: "1"
            - name: CONFIG_FILE
              value: "/etc/act_runner/config.yaml"
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
            - name: runner-config
              mountPath: /etc/act_runner
        - name: dind
          image: docker:dind
          securityContext:
            privileged: true
          # Gitea Container Registry(10.0.0.23:80)가 HTTP·PoC 단계라 dockerd 기본값(HTTPS)으로
          # 접속하면 "server gave HTTP response to HTTPS client"로 실패한다 — insecure-registry로 등록.
          args:
            - "--insecure-registry=10.0.0.23:80"
          env:
            - name: DOCKER_TLS_CERTDIR
              value: "/certs"
          volumeMounts:
            - name: docker-certs
              mountPath: /certs
      volumes:
        - name: docker-certs
          emptyDir: {}
        - name: runner-config
          configMap:
            name: gitea-runner-config
