name: build-and-push
on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Docker login
        run: echo "${{ secrets.REGISTRY_TOKEN }}" | docker login 10.0.0.23:80 -u gitea_admin --password-stdin

      - name: Build and push
        run: |
          docker build -t 10.0.0.23:80/myorg/k8s-manager:${{ gitea.sha }} .
          docker push 10.0.0.23:80/myorg/k8s-manager:${{ gitea.sha }}
